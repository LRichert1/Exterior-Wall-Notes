<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exterior Wall Notes</title>
<!-- Home-screen app (iPad/iPhone "Add to Home Screen"): full-screen launch, name + icon -->
<meta name="theme-color" content="#1f4e79">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wall Notes">
<link rel="apple-touch-icon" href="Wall_Notes_icon.png">
<link rel="icon" type="image/png" href="Wall_Notes_icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root{
    --bg:#f4f6f8; --panel:#ffffff; --ink:#1f2933; --muted:#6b7785;
    --line:#d9e0e6; --line-strong:#b9c4cd;
    --brand:#1f4e79; --brand-700:#16395a; --brand-50:#eaf1f8;
    --accent:#2f80b8;
    --danger:#b42318; --danger-bg:#fdecea;
    --ok:#2e7d32;
    --shadow:0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.10);
    --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    color:var(--ink); background:var(--bg); font-size:15px; line-height:1.45;
  }
  button{font-family:inherit}
  input,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
  .wrap{max-width:1040px;margin:0 auto;padding:20px 18px 60px}

  /* ---------- Top brand bar ---------- */
  .appbar{
    background:var(--brand); color:#fff;
    display:flex;align-items:center;gap:12px;
    padding:12px 18px; box-shadow:var(--shadow);
  }
  .appbar .logo{font-weight:700;letter-spacing:.3px}
  .appbar .sub{opacity:.8;font-size:13px}
  .appbar .spacer{flex:1}
  .appbar .siteTag{
    background:rgba(255,255,255,.14); padding:4px 10px;border-radius:999px;
    font-size:13px; display:none; align-items:center; gap:6px;
  }

  /* ---------- Buttons ---------- */
  .btn{
    border:1px solid var(--line-strong); background:#fff; color:var(--ink);
    padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;
    display:inline-flex;align-items:center;gap:7px;transition:.12s;
  }
  .btn:hover{background:#f3f6f9}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:var(--brand-700)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.sm{padding:6px 10px;font-size:13px}

  /* ---------- Cards ---------- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}

  /* ---------- Setup screen ---------- */
  #setup .card{max-width:640px;margin:34px auto;padding:26px 28px}
  #setup h1{margin:0 0 4px;font-size:22px;color:var(--brand-700)}
  #setup p.lead{margin:0 0 22px;color:var(--muted)}
  .field{margin-bottom:20px}
  .field label{display:block;font-weight:600;margin-bottom:7px}
  .field .hint{font-weight:400;color:var(--muted);font-size:13px}
  input.text{
    width:100%;padding:11px 12px;border:1px solid var(--line-strong);border-radius:8px;background:#fff;
  }
  input.text:focus,textarea:focus,input.loc:focus{outline:2px solid var(--brand-50);border-color:var(--brand)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:520px){.row2{grid-template-columns:1fr}}

  .qtylist{display:flex;flex-direction:column;gap:10px}
  .qtyrow{
    display:flex;align-items:center;gap:12px;border:1px solid var(--line-strong);
    border-radius:9px;padding:9px 14px;background:#fff;transition:.12s;
  }
  .qtyrow.on{border-color:var(--brand);background:var(--brand-50);box-shadow:inset 0 0 0 1px var(--brand)}
  .qtyrow .qnm{font-weight:600;flex:1}
  .stepper{display:flex;align-items:center;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:#fff}
  .stepper button{width:38px;height:38px;border:none;background:#f3f6f9;font-size:21px;line-height:1;cursor:pointer;color:var(--brand);font-weight:700}
  .stepper button:hover{background:var(--brand-50)}
  .stepper input{width:46px;height:38px;border:none;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;font-size:15px;font-weight:600;-moz-appearance:textfield}
  .stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

  .setup-note{font-size:12.5px;color:var(--muted);margin:10px 0 18px}
  .setup-actions{display:flex;gap:12px;align-items:center;margin-top:8px}
  .setup-actions .spacer{flex:1}
  .resume{margin:0 auto 18px;max-width:640px}
  .resume .card{display:flex;gap:12px;align-items:center;padding:14px 18px;border-left:4px solid var(--accent)}
  .resume .card .t{font-weight:600}
  .resume .card .m{color:var(--muted);font-size:13px}

  /* ---------- Form screen ---------- */
  #form{display:none}
  .toolbar{
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0 14px;
  }
  .toolbar .spacer{flex:1}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end;border-bottom:2px solid var(--line);margin-bottom:0}
  .tab{
    border:1px solid var(--line);border-bottom:none;background:#eef2f5;color:var(--muted);
    padding:10px 18px;border-radius:9px 9px 0 0;cursor:pointer;font-weight:600;position:relative;top:2px;
  }
  .tab:hover{color:var(--ink)}
  .tab.active{background:var(--panel);color:var(--brand-700);border-color:var(--line);border-bottom:2px solid var(--panel)}
  .addwrap{position:relative;display:inline-block}
  .addbtn{
    border:1px dashed var(--line-strong);background:#fff;color:var(--brand);
    padding:9px 14px;border-radius:9px;cursor:pointer;font-weight:600;position:relative;top:2px;
  }
  .addbtn:hover{background:var(--brand-50);border-color:var(--brand)}
  .addmenu{
    position:absolute;top:46px;left:0;background:#fff;border:1px solid var(--line-strong);
    border-radius:8px;box-shadow:0 8px 24px rgba(16,24,40,.16);padding:6px;z-index:30;min-width:180px;display:none;
  }
  .addmenu.open{display:block}
  .addmenu .mhdr{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding:5px 10px 7px}
  .addmenu .mi{display:block;width:100%;text-align:left;border:none;background:transparent;padding:9px 12px;border-radius:6px;cursor:pointer;font-size:14px;color:var(--ink)}
  .addmenu .mi:hover{background:var(--brand-50)}

  .panel{background:var(--panel);border:1px solid var(--line);border-top:none;border-radius:0 0 var(--radius) var(--radius);padding:20px 22px}
  .panel h2{margin:0 0 3px;font-size:20px;color:var(--brand-700)}
  .panel .barnsub{color:var(--muted);font-size:13px;margin-bottom:10px}
  .barnctl{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}
  .barnctl button{
    border:1px solid var(--line);background:#fff;color:var(--muted);font-size:12.5px;font-weight:600;
    padding:5px 11px;border-radius:7px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;
  }
  .barnctl button:hover{background:#f3f6f9;color:var(--ink)}
  .barnctl button.danger:hover{background:var(--danger-bg);color:var(--danger);border-color:#f3c0bb}

  .tablehdr{display:flex;align-items:center;margin:6px 0 8px}
  .tablehdr h3{margin:0;font-size:16px}
  .tablehdr .spacer{flex:1}
  .tablehdr .count{color:var(--muted);font-size:13px}

  .rowhead{
    display:grid;grid-template-columns:290px 1fr 36px;gap:10px;
    padding:0 2px 6px;font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;
  }
  .rows{display:flex;flex-direction:column;gap:8px}
  .trow{display:grid;grid-template-columns:290px 1fr 36px;gap:10px;align-items:start}
  .trow input.loc{
    padding:10px 11px;border:1px solid var(--line-strong);border-radius:8px;width:100%;
  }
  .trow select.notes{
    padding:9px 11px;border:1px solid var(--line-strong);border-radius:8px;width:100%;
    height:42px;line-height:1.45;font-size:15px;background:#fff;color:var(--ink);cursor:pointer;
  }
  .trow select.notes:focus{outline:2px solid var(--brand-50);border-color:var(--brand)}
  .trow select.notes.unset{color:var(--muted)}
  .trow.empty input.loc, .trow.empty select.notes{background:#fcfdfe;border-style:dashed}
  .trow .del{
    border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;
    width:36px;height:42px;border-radius:8px;font-size:18px;line-height:1;visibility:hidden;
  }
  .trow .del:hover{background:var(--danger-bg);color:var(--danger);border-color:#f3c0bb}
  .trow.filled .del{visibility:visible}
  @media(max-width:560px){
    .rowhead,.trow{grid-template-columns:1fr 36px}
    .rowhead .rh-notes{display:none}
    .trow select.notes{grid-column:1 / 2}
    .trow .del{grid-row:1 / 3}
  }

  .barnfields{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:22px 0 4px}
  @media(max-width:620px){.barnfields{grid-template-columns:1fr}}
  .bfield label{display:block;font-weight:600;margin-bottom:7px}
  .bfield .sub{font-weight:400;color:var(--muted);font-size:12.5px}
  input.rebound{
    width:100%;padding:10px 12px;border:1px solid var(--line-strong);border-radius:8px;background:#fff;
  }
  input.rebound:focus{outline:2px solid var(--brand-50);border-color:var(--brand)}
  textarea.general{
    width:100%;min-height:60px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:8px;
    resize:vertical;line-height:1.5;
  }

  .footnote{color:var(--muted);font-size:12.5px;margin-top:14px;display:flex;align-items:center;gap:7px}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--brand-700);color:#fff;padding:11px 18px;border-radius:9px;box-shadow:0 6px 20px rgba(0,0,0,.25);
    opacity:0;pointer-events:none;transition:.25s;font-size:14px;z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---------- Site map + footprint pins ---------- */
  .mapsec{margin:20px 0 4px;border-top:1px solid var(--line);padding-top:16px}
  .maphdr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .maphdr h3{margin:0;font-size:16px}
  .maphdr .spacer{flex:1}
  .maphdr .stat{color:var(--muted);font-size:12.5px}
  .mapctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .mapctl button{
    border:1px solid var(--line);background:#fff;color:var(--muted);font-size:12.5px;font-weight:600;
    padding:5px 11px;border-radius:7px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;
  }
  .mapctl button:hover{background:#f3f6f9;color:var(--ink)}
  .mapctl button.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .mapctl button.danger:hover{background:var(--danger-bg);color:var(--danger);border-color:#f3c0bb}
  .mapctl select{
    padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;
    font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;
  }

  .mapdrop{
    border:2px dashed var(--line-strong);border-radius:var(--radius);background:#fbfcfd;
    padding:26px 20px;text-align:center;color:var(--muted);
  }
  .mapdrop .big{font-size:30px;line-height:1;margin-bottom:8px}
  .mapdrop .t{font-weight:600;color:var(--ink);margin-bottom:3px}
  .mapdrop .s{font-size:12.5px;margin-bottom:14px}

  /* stage holds the image; pins + trace handles are positioned in % over it */
  .mapstage{position:relative;display:block;width:100%;line-height:0;
    border:1px solid var(--line-strong);border-radius:var(--radius);overflow:hidden;background:#eef2f5;
    touch-action:none}
  .mapstage img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
  /* zoomed variant: the img is oversized and offset so one barn fills the frame */
  .mapstage.zoom img{position:absolute;width:auto;height:auto;max-width:none}

  /* --- setup: trace the barns onto the map --- */
  .tracebox{position:absolute;border:2px solid var(--accent);background:rgba(47,128,184,.14);
    cursor:pointer;box-sizing:border-box}
  .tracebox.sel{border-color:#ffb300;background:rgba(255,179,0,.18);border-width:3px}
  .tracebox.round{border-radius:50%}
  .handle.mid{width:26px;height:26px;background:var(--brand)}
  /* top-centre keeps the label clear of all four corner drag handles */
  .tracebox .tag{
    position:absolute;top:-1px;left:50%;transform:translateX(-50%);
    background:var(--accent);color:#fff;
    font-size:11px;font-weight:700;line-height:1;padding:3px 7px;border-radius:0 0 5px 5px;white-space:nowrap;
  }
  .tracebox.sel .tag{background:#e69500}
  .newbox{position:absolute;border:2px dashed var(--brand);background:rgba(31,78,121,.12);pointer-events:none}

  .tlist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .trowb{display:grid;grid-template-columns:34px 1fr 150px 34px;gap:9px;align-items:center;
    border:1px solid var(--line-strong);border-radius:9px;padding:7px 10px;background:#fff;cursor:pointer}
  .trowb.sel{border-color:#e69500;box-shadow:inset 0 0 0 1px #e69500;background:#fffaf0}
  .trowb .num{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;
    font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .trowb.sel .num{background:#e69500}
  .trowb input,.trowb select{padding:7px 9px;border:1px solid var(--line-strong);border-radius:7px;
    background:#fff;font-size:14px;width:100%}
  .trowb .rm{border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;
    width:30px;height:32px;border-radius:7px;font-size:17px;line-height:1}
  .trowb .rm:hover{background:var(--danger-bg);color:var(--danger);border-color:#f3c0bb}
  .tempty{color:var(--muted);font-size:13px;padding:10px 2px}

  /* --- tap a corner -> pick the reading right there --- */
  .pickwrap{position:fixed;inset:0;z-index:60}
  .pickmenu{
    position:fixed;background:#fff;border:1px solid var(--line-strong);border-radius:10px;
    box-shadow:0 10px 30px rgba(16,24,40,.26);padding:7px;min-width:200px;max-height:70vh;overflow:auto;
  }
  .pickmenu .ph{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;
    letter-spacing:.4px;padding:5px 10px 8px;border-bottom:1px solid var(--line);margin-bottom:5px}
  .pickmenu button{display:block;width:100%;text-align:left;border:none;background:transparent;
    padding:11px 12px;border-radius:7px;cursor:pointer;font-size:15px;color:var(--ink);font-weight:600}
  .pickmenu button:hover{background:var(--brand-50)}
  .pickmenu button.cur{background:var(--brand);color:#fff}
  .pickmenu button.clear{color:var(--danger);font-weight:600}
  .mapstage svg.trace{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .mapstage svg.trace polygon,
  .mapstage svg.trace ellipse{fill:rgba(47,128,184,.16);stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke}
  /* free-mark structures: the outline is the tap target */
  .mapstage.free{cursor:crosshair}

  .pin{
    position:absolute;transform:translate(-50%,-50%);
    width:30px;height:30px;border-radius:50%;border:2px solid #fff;
    background:var(--brand);color:#fff;font-size:12px;font-weight:700;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
    box-shadow:0 1px 4px rgba(0,0,0,.4);touch-action:manipulation;
  }
  .pin:hover{background:var(--brand-700)}
  .pin.done{background:var(--ok)}
  .pin.sel{outline:3px solid #ffd54f;outline-offset:1px}
  .pin .lbl{
    position:absolute;bottom:34px;left:50%;transform:translateX(-50%);
    background:rgba(31,41,51,.92);color:#fff;font-size:11px;font-weight:600;
    padding:3px 7px;border-radius:5px;white-space:nowrap;display:none;pointer-events:none;
  }
  .pin:hover .lbl,.pin.sel .lbl{display:block}

  .handle{
    position:absolute;transform:translate(-50%,-50%);
    width:34px;height:34px;border-radius:50%;border:3px solid #fff;background:var(--accent);
    cursor:grab;touch-action:none;box-shadow:0 1px 5px rgba(0,0,0,.45);
  }
  .handle:active{cursor:grabbing;background:var(--brand)}
  .tracetip{
    background:var(--brand-50);border:1px solid var(--brand);border-radius:8px;
    padding:9px 13px;font-size:13px;color:var(--brand-700);margin-bottom:10px;
  }
  .trow.hit input.loc{border-color:var(--ok);box-shadow:0 0 0 2px rgba(46,125,50,.18)}

  /* ---------- Print report ---------- */
  #printArea{display:none}
  @media print{
    .appbar,.toolbar,.tabs,.panel,#setup,.resume,.toast{display:none !important}
    body{background:#fff}
    .wrap{max-width:none;padding:0}
    #printArea{display:block}
    .phead{margin:0 0 14px}
    .phead h1{font-size:18px;margin:0 0 2px;color:#000}
    .phead .pmeta{font-size:12px;color:#333}
    .pbarn{page-break-after:always;padding:6px 0 0}
    .pbarn:last-child{page-break-after:auto}
    .pbarn h2{font-size:16px;margin:0 0 8px;color:#000}
    table.ptab{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:8px}
    table.ptab th,table.ptab td{border:1px solid #555;padding:5px 8px;text-align:left;vertical-align:top}
    table.ptab th{background:#e8eef4}
    table.ptab td.lcol{width:28%}
    .pbarn .pline{font-size:12px;margin:3px 0;white-space:pre-wrap}
    .pbarn .pline b{color:#000}
  }
</style>
</head>
<body>

<div class="appbar">
  <span class="logo">Johnson Engineering</span>
  <span class="sub">Exterior Wall Notes</span>
  <span class="spacer"></span>
  <span class="siteTag" id="siteTag">📍 <b id="siteTagName"></b></span>
</div>

<!-- ============ SETUP SCREEN ============ -->
<section id="setup" class="wrap">
  <div class="resume" id="resumeBox" style="display:none">
    <div class="card">
      <div style="flex:1">
        <div class="t">Resume previous session</div>
        <div class="m" id="resumeMeta"></div>
      </div>
      <button class="btn" id="resumeDiscard">Discard</button>
      <button class="btn primary" id="resumeBtn">Resume</button>
    </div>
  </div>

  <div class="card">
    <h1>Exterior Wall Notes</h1>
    <p class="lead">Set up this assessment, then choose which barns are on site and how many of each. Each barn becomes its own tab.</p>

    <div class="field">
      <label for="siteInput">Site <span class="hint">(e.g., M25)</span></label>
      <input class="text" id="siteInput" type="text" placeholder="Enter site name or number" autocomplete="off">
    </div>

    <div class="row2">
      <div class="field">
        <label for="dateInput">Date</label>
        <input class="text" id="dateInput" type="date">
      </div>
      <div class="field">
        <label for="nameInput">Name <span class="hint">(recorded by)</span></label>
        <input class="text" id="nameInput" type="text" placeholder="Inspector / engineer" autocomplete="off">
      </div>
    </div>

    <div class="field">
      <label>Site map <span class="hint">(upload once — then trace and label each barn on it)</span></label>
      <div id="mapSetup"></div>
    </div>

    <!-- With a map, the barns are whatever you traced. Without one, fall back
         to the per-type counts. Only one of these two is ever visible. -->
    <div class="field" id="qtyField">
      <label>Which barns are at this site, and how many? <span class="hint">(set a count for each)</span></label>
      <div class="qtylist" id="barnList"></div>
    </div>
    <div class="setup-note" id="qtyNote">Tip: you can still add, duplicate, rename or remove barns once you’re in the form.</div>

    <div class="setup-actions">
      <button class="btn" id="loadFileBtn">📂 Open saved file…</button>
      <span class="spacer"></span>
      <button class="btn primary" id="startBtn" disabled>Open form →</button>
    </div>
  </div>
</section>

<!-- ============ FORM SCREEN ============ -->
<section id="form" class="wrap">
  <div class="toolbar">
    <button class="btn sm" id="setupBtn">⚙ Setup</button>
    <span class="spacer"></span>
    <button class="btn sm" id="saveBtn">💾 Save file</button>
    <button class="btn sm" id="openBtn">📂 Open</button>
    <button class="btn sm" id="printBtn">🖨 Print</button>
    <button class="btn sm" id="mapPdfBtn">🗺 Map PDF</button>
    <button class="btn sm primary" id="xlsxBtn">⬇ Export to Excel</button>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="panel" id="panel"></div>
</section>

<div id="printArea"></div>
<div class="toast" id="toast"></div>

<!-- quick-pick suggestions for the Location field (populated from DEFAULT_LOCATIONS at load) -->
<datalist id="locOptions"></datalist>

<!-- hidden file input for loading -->
<input type="file" id="fileInput" accept=".html,.json,text/html,application/json" style="display:none">

<!-- hidden file input for the site map image (iPad offers Photo Library / Take Photo / Files) -->
<input type="file" id="mapInput" accept="image/*" style="display:none">

<script>
"use strict";

/* ------------------------------------------------------------------ *
 *  Barn types.  Tab title shown on each panel/sheet is:
 *    "Exterior Wall Notes for " + instance name
 *  (matches the original workbook: "Exterior Wall Notes for Breeding",
 *   "...for Gestation", "...for Isolation Barn", etc.)
 * ------------------------------------------------------------------ */
/*  shape : "rect" (default) traces a box, "circle" traces a circle.
 *  pins  : "preset" (default) pre-lists the 8 standard corner checkpoints,
 *          "free" starts empty and you tap anywhere along the outline to
 *          drop a reading — manure tanks and cisterns have no meaningful
 *          "northeast corner", so their points are placed as found.        */
const BARN_TYPES = [
  {key:"Gestation", label:"Gestation"},
  {key:"Farrowing", label:"Farrowing"},
  {key:"Breeding",  label:"Breeding"},
  {key:"GDU",       label:"GDU"},
  {key:"Isolation", label:"Isolation Barn"},
  {key:"Other",     label:"Other barn"},
  {key:"Cistern",   label:"Cistern",    pins:"free", noun:"cistern"},
  {key:"Tank",      label:"Round tank", pins:"free", shape:"circle", noun:"tank"},
];
const BTYPE = Object.fromEntries(BARN_TYPES.map(b=>[b.key,b]));
const typeRank = k => BARN_TYPES.findIndex(b=>b.key===k);
const shapeOf  = k => (BTYPE[k] && BTYPE[k].shape) || "rect";
const isFree   = k => !!(BTYPE[k] && BTYPE[k].pins==="free");
// "barn" reads wrong on a manure tank — label the UI by what it actually is.
const nounOf   = k => (BTYPE[k] && BTYPE[k].noun) || "barn";
const Noun     = k => { const n=nounOf(k); return n[0].toUpperCase()+n.slice(1); };
const AUTOSAVE_KEY = "ewallNotes.autosave.v1";

/* ------------------------------------------------------------------ *
 *  State.  Barns are keyed by a generated instance id; each instance
 *  has {type, name, rebound, general, rows}.  A site can hold several
 *  of one type (e.g. two Gestation barns -> "Gestation 1"/"Gestation 2").
 * ------------------------------------------------------------------ */
// STATE.map is the ONE site map shared by every barn: {src (downscaled JPEG
// data URL), w, h}. Each barn keeps its own traced footprint in barn.foot =
// {quad:[{x,y}x4] normalized 0..1 over the image, north: 0|90|180|270}, from
// which the 8 labeled pins are derived. null foot = not traced yet.
let STATE = { site:"", date:"", inspector:"", order:[], barns:{}, active:null, map:null };
let PRISTINE_HTML = "";           // clean copy of this page, captured at load, used for "Save"
let _rid = 1, _bid = 1;
// x,y (normalized map coords) are set only on free-placed marks — a row that
// carries them draws as a tappable point on that structure's outline.
const newRow = (location="",notes="",x,y)=>{
  const r={id:_rid++, location, notes};
  if (x!==undefined && x!==null){ r.x=x; r.y=y; }
  return r;
};
const newId  = ()=>"b"+(_bid++);
// Standard exterior-wall checkpoints, pre-listed in each barn so the field
// inspector only fills in the reading. Clockwise: each corner with its two
// adjacent walls (N→E→S→W). Fully editable — rows can be deleted or added.
const DEFAULT_LOCATIONS = [
  "Northeast corner – North side",
  "Northeast corner – East side",
  "Southeast corner – East side",
  "Southeast corner – South side",
  "Southwest corner – South side",
  "Southwest corner – West side",
  "Northwest corner – West side",
  "Northwest corner – North side",
];
// Fixed set of plumb/level readings offered in the Notes dropdown: "level",
// then each size paired top in / top out, ascending. Readings from older saved
// files that aren't in this list (e.g. the 1/8" pair) are still preserved by
// buildNotesSelect, which appends any unrecognized value as an extra option.
const NOTES_OPTIONS = ['level',
  '1/4" top in','1/4" top out',
  '1/2" top in','1/2" top out',
  '3/4" top in','3/4" top out',
  '1" top in','1" top out'];
// Free-pin structures (tanks, cisterns) start empty — their readings are
// placed on the outline in the field, not pre-listed.
const makeBarn = (type,name)=>({type, name, rebound:"", general:"", foot:null,
  rows: isFree(type) ? [ newRow() ]
                     : [ ...DEFAULT_LOCATIONS.map(loc=>newRow(loc)), newRow() ]});

/* ------------------------------------------------------------------ *
 *  Site map geometry.
 *
 *  The inspector drags a 4-corner box over the barn on the site map and
 *  says which way north points. From that we work out, purely from the
 *  geometry, which edge is the north/east/south/west wall and which
 *  corner is NE/SE/SW/NW — so nobody has to reason about compass
 *  direction while walking the building. Each of the 8 pins is one
 *  corner paired with one of its two adjacent walls, which is exactly
 *  the DEFAULT_LOCATIONS vocabulary.
 * ------------------------------------------------------------------ */
const NORTH_CHOICES = [{v:0,t:"↑ up"},{v:90,t:"→ right"},{v:180,t:"↓ down"},{v:270,t:"← left"}];
const COMPASS = ["North","East","South","West"];          // index = bearing/90
const DEFAULT_QUAD = [{x:.22,y:.24},{x:.78,y:.24},{x:.78,y:.76},{x:.22,y:.76}];
const cloneQuad = q => q.map(p=>({x:p.x,y:p.y}));

// Screen bearing of a vector, in degrees clockwise from "up" (y grows down).
const bearingOf = (dx,dy) => (Math.atan2(dx,-dy)*180/Math.PI + 360) % 360;
const angDist = (a,b) => { const d=Math.abs(((a-b)%360+360)%360); return d>180?360-d:d; };

// Assign each of the 4 edges a distinct compass index, best fit first, so a
// rotated or slightly skewed footprint still yields one N, one E, one S, one W.
function edgeDirections(quad, north){
  const bear = [];
  for (let i=0;i<4;i++){
    const a=quad[i], b=quad[(i+1)%4];
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    const c={x:(quad[0].x+quad[1].x+quad[2].x+quad[3].x)/4,
             y:(quad[0].y+quad[1].y+quad[2].y+quad[3].y)/4};
    // outward normal = midpoint pushed away from the centroid
    bear.push((bearingOf(mx-c.x, my-c.y) - north + 360) % 360);
  }
  const cand=[];
  for (let e=0;e<4;e++) for (let d=0;d<4;d++) cand.push({e,d,err:angDist(bear[e], d*90)});
  cand.sort((p,q)=>p.err-q.err);
  const dirOf=new Array(4).fill(-1), usedD=new Set(), usedE=new Set();
  for (const c of cand){
    if (usedE.has(c.e)||usedD.has(c.d)) continue;
    dirOf[c.e]=c.d; usedE.add(c.e); usedD.add(c.d);
  }
  return dirOf;   // dirOf[edgeIndex] = compass index
}

// North is a property of the MAP (one image, one orientation), not of each barn.
const mapNorth = ()=> (STATE.map && STATE.map.north) || 0;

// The 8 pins, in DEFAULT_LOCATIONS order where possible.
function computePins(foot, north){
  if (!foot || !foot.quad) return [];        // circles have no corners
  if (north===undefined) north=mapNorth();
  const q=foot.quad, dirOf=edgeDirections(q, north), pins=[];
  for (let corner=0; corner<4; corner++){
    const prev=(corner+3)%4;                       // edge arriving at this corner
    const next=corner;                             // edge leaving this corner
    const dirs=[dirOf[prev], dirOf[next]];
    const ns=dirs.find(d=>d===0||d===2), ew=dirs.find(d=>d===1||d===3);
    if (ns===undefined || ew===undefined) continue;             // 45°-ish, skip
    const cname=COMPASS[ns]+COMPASS[ew].toLowerCase();          // "Northeast"
    [prev,next].forEach(e=>{
      const a=q[e], b=q[(e+1)%4];
      // sit the pin ~20% along the wall, measured from this corner
      const from = (e===next) ? a : b, to = (e===next) ? b : a;
      pins.push({
        location: cname+" corner – "+COMPASS[dirOf[e]]+" side",
        x: from.x + (to.x-from.x)*0.2,
        y: from.y + (to.y-from.y)*0.2
      });
    });
  }
  const rank = l => { const i=DEFAULT_LOCATIONS.indexOf(l); return i<0?99:i; };
  pins.sort((a,b)=>rank(a.location)-rank(b.location));
  return pins;
}

// The pins to draw for a structure: derived corners for barns, or the
// free-placed marks (rows carrying x,y) for tanks and cisterns.
function pinsFor(barn){
  if (!barn.foot) return [];
  if (isFree(barn.type))
    return barn.rows.filter(r=>r.x!==undefined && r.x!==null)
                    .map(r=>({location:r.location, x:r.x, y:r.y, row:r}));
  return computePins(barn.foot);
}

/* ------------------------------------------------------------------ *
 *  Small helpers
 * ------------------------------------------------------------------ */
const $ = sel => document.querySelector(sel);
const el = (tag, props={}, kids=[]) => {
  const n = document.createElement(tag);
  for (const k in props){
    if (k==="class") n.className = props[k];
    else if (k==="text") n.textContent = props[k];
    else if (k.startsWith("on") && typeof props[k]==="function") n.addEventListener(k.slice(2), props[k]);
    else if (props[k]!==null && props[k]!==undefined) n.setAttribute(k, props[k]);
  }
  for (const c of [].concat(kids)) if (c) n.appendChild(typeof c==="string"?document.createTextNode(c):c);
  return n;
};
const rowEmpty = r => !r.location.trim() && !r.notes.trim();
const titleFor = b => "Exterior Wall Notes for " + b.name;
function safeName(s){ return (s||"").replace(/[\\/:*?"<>|]+/g,"-").trim(); }
function instancesOfType(type){ return STATE.order.filter(id=>STATE.barns[id].type===type); }
function barnHasData(id){
  const b=STATE.barns[id];
  return (b.rebound||"").trim()!=="" || (b.general||"").trim()!=="" || b.rows.some(r=>!rowEmpty(r));
}
function todayIso(){
  const d=new Date(), p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}
function fmtDate(iso){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||"");
  if(!m) return iso||"";
  return new Date(+m[1],+m[2]-1,+m[3]).toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"});
}
function subLine(){
  const p=[];
  if(STATE.site) p.push("Site: "+STATE.site);
  if(STATE.date) p.push(fmtDate(STATE.date));
  if(STATE.inspector) p.push("Recorded by "+STATE.inspector);
  return p.join("  ·  ");
}

let _toastT=null;
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(_toastT); _toastT=setTimeout(()=>t.classList.remove("show"),2000);
}

/* ------------------------------------------------------------------ *
 *  Autosave (best-effort; the saved file is the reliable store)
 * ------------------------------------------------------------------ */
function autosave(){
  try{ localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(serialize())); }catch(e){/* file:// may block */}
}
function serialize(){
  return {
    // v3: north moved from each barn's foot onto the shared map
    version:3, savedAt:new Date().toISOString(),
    site:STATE.site, date:STATE.date, inspector:STATE.inspector, order:STATE.order.slice(),
    map:STATE.map,                                   // shared site map (downscaled JPEG data URL)
    barns:Object.fromEntries(STATE.order.map(id=>{
      const b=STATE.barns[id];
      return [id,{
        type:b.type, name:b.name, rebound:b.rebound, general:b.general,
        foot:b.foot,                                 // traced outline (quad or circle)
        rows:b.rows.filter(r=>!rowEmpty(r)).map(r=>{
          const o={location:r.location, notes:r.notes};
          if (r.x!==undefined){ o.x=r.x; o.y=r.y; }  // free-placed mark
          return o;
        })
      }];
    }))
  };
}
function deserialize(data){
  STATE = { site:data.site||"", date:data.date||"", inspector:data.inspector||"", order:[], barns:{}, active:null,
            map:(data.map && data.map.src) ? data.map : null };   // v1 files simply have no map
  _bid = 1; TRACE_SEL=null; SELPIN=null; ZOOMOUT=false;
  // v2 files kept north on each barn; it now lives on the map. Take the first
  // one we see so those files keep their orientation.
  let legacyNorth = null;
  (data.order||[]).forEach(oldId=>{
    const b = (data.barns && data.barns[oldId]) || {};
    let type = b.type || (BTYPE[oldId] ? oldId : null);
    if (!BTYPE[type]) return;                              // skip unknown types
    const id = newId();
    const name = b.name || BTYPE[type].label;
    const rows = (b.rows||[]).map(r=>newRow(r.location||r.truss||"", r.notes||"", r.x, r.y));
    let foot = null;
    if (b.foot && Array.isArray(b.foot.quad) && b.foot.quad.length===4){
      foot = { quad:cloneQuad(b.foot.quad) };
      if (legacyNorth===null && b.foot.north!==undefined) legacyNorth = +b.foot.north||0;
    } else if (b.foot && b.foot.circle && typeof b.foot.circle.r==="number"){
      const c=b.foot.circle;
      foot = { circle:{cx:+c.cx||0, cy:+c.cy||0, r:+c.r||0.05} };
    }
    STATE.barns[id] = { type, name, rebound:b.rebound||"", general:b.general||"", foot, rows };
    STATE.order.push(id);
    ensureTrailingEmpty(id);
  });
  if (STATE.map && STATE.map.north===undefined) STATE.map.north = legacyNorth||0;
  STATE.active = STATE.order[0] || null;
}

/* ------------------------------------------------------------------ *
 *  Row maintenance — always keep exactly one trailing empty row
 * ------------------------------------------------------------------ */
function ensureTrailingEmpty(id){
  const rows = STATE.barns[id].rows;
  if (rows.length===0 || !rowEmpty(rows[rows.length-1])) rows.push(newRow());
}

/* ================================================================== *
 *  SETUP SCREEN
 * ================================================================== */
function buildSetup(){
  const list = $("#barnList"); list.innerHTML="";
  BARN_TYPES.forEach(b=>{
    const inp = el("input",{class:"qty",type:"number",min:"0",value:"0",inputmode:"numeric","aria-label":b.label+" count"});
    const dec = el("button",{class:"dec",type:"button",text:"−","aria-label":"decrease"});
    const inc = el("button",{class:"inc",type:"button",text:"+","aria-label":"increase"});
    const row = el("div",{class:"qtyrow"},[
      el("span",{class:"qnm",text:b.label}),
      el("div",{class:"stepper"},[dec,inp,inc])
    ]);
    row.dataset.type = b.key;
    const sync = ()=>{
      let v = parseInt(inp.value,10); if(isNaN(v)||v<0) v=0; if(v>99) v=99;
      inp.value=v; row.classList.toggle("on", v>0); refreshStart();
    };
    dec.addEventListener("click", ()=>{ inp.value=Math.max(0,(parseInt(inp.value,10)||0)-1); sync(); });
    inc.addEventListener("click", ()=>{ inp.value=(parseInt(inp.value,10)||0)+1; sync(); });
    inp.addEventListener("input", sync);
    inp.addEventListener("change", sync);
    list.appendChild(row);
  });
  if(!$("#dateInput").value) $("#dateInput").value = todayIso();
  $("#siteInput").addEventListener("input", refreshStart);
  renderMapSetup();
  refreshStart();
}
function setupCounts(){
  const m={};
  document.querySelectorAll("#barnList .qtyrow").forEach(row=>{
    const v = parseInt(row.querySelector(".qty").value,10)||0;
    if (v>0) m[row.dataset.type]=v;
  });
  return m;
}
function totalSetupQty(){ return Object.values(setupCounts()).reduce((a,b)=>a+b,0); }
function refreshStart(){
  // With a map the barns come from the traced boxes; without one, from the counts.
  const enough = STATE.map ? STATE.order.length>0 : totalSetupQty()>0;
  const ok = $("#siteInput").value.trim()!=="" && enough;
  $("#startBtn").disabled = !ok;
  const b=$("#startBtn");
  if (b) b.textContent = (STATE.map && STATE.order.length)
    ? "Open form → "+STATE.order.length+" barn"+(STATE.order.length>1?"s":"")
    : "Open form →";
}
function prefillSetup(){
  $("#siteInput").value = STATE.site||"";
  $("#dateInput").value = STATE.date||todayIso();
  $("#nameInput").value = STATE.inspector||"";
  renderMapSetup();
  const counts={};
  STATE.order.forEach(id=>{ const t=STATE.barns[id].type; counts[t]=(counts[t]||0)+1; });
  document.querySelectorAll("#barnList .qtyrow").forEach(row=>{
    const v = counts[row.dataset.type]||0;
    row.querySelector(".qty").value = v;
    row.classList.toggle("on", v>0);
  });
  refreshStart();
}
// Is this name still an auto-generated one ("Gestation" or "Gestation 2")?
function isAutoName(name, label){
  if (name===label) return true;
  const esc = label.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  return new RegExp("^"+esc+" \\d+$").test(name);
}
function renumberAll(){
  BARN_TYPES.forEach(tp=>{
    const ids = instancesOfType(tp.key);
    if (ids.length===1){
      const id=ids[0];
      if (isAutoName(STATE.barns[id].name, tp.label)) STATE.barns[id].name = tp.label;
    } else {
      let n=0;
      ids.forEach(id=>{ if (isAutoName(STATE.barns[id].name, tp.label)){ n++; STATE.barns[id].name = tp.label+" "+n; } });
    }
  });
}
function startFromSetup(){
  const site = $("#siteInput").value.trim();
  if (!site) return;

  // Map mode: the barns are whatever was traced and labeled on the map, so
  // there is nothing to reconcile — the per-type counts don't apply at all.
  if (STATE.map){
    if (!STATE.order.length) return;
    STATE.site = site;
    STATE.date = $("#dateInput").value || "";
    STATE.inspector = $("#nameInput").value.trim();
    if (!STATE.active || !STATE.barns[STATE.active]) STATE.active = STATE.order[0];
    STATE.order.forEach(ensureTrailingEmpty);
    showForm();
    return;
  }

  const counts = setupCounts();
  if (totalSetupQty()===0) return;

  // Warn before removing any barn that already has data entered.
  const losing=[];
  BARN_TYPES.forEach(tp=>{
    const target=counts[tp.key]||0, cur=instancesOfType(tp.key);
    for(let i=target;i<cur.length;i++) if(barnHasData(cur[i])) losing.push(STATE.barns[cur[i]].name);
  });
  if (losing.length && !confirm("Lowering the count will remove these barns and their notes:\n\n  • "+losing.join("\n  • ")+"\n\nContinue?")) return;

  STATE.site = site;
  STATE.date = $("#dateInput").value || "";
  STATE.inspector = $("#nameInput").value.trim();

  // Reconcile each type's instance count to the chosen target.
  BARN_TYPES.forEach(tp=>{
    const target = counts[tp.key]||0;
    let cur = instancesOfType(tp.key);
    while (cur.length > target){                 // remove extras from the end
      const id = cur.pop();
      STATE.order.splice(STATE.order.indexOf(id),1);
      delete STATE.barns[id];
    }
    while (cur.length < target){                 // add missing
      const id = newId();
      STATE.barns[id] = makeBarn(tp.key, tp.label);
      STATE.order.push(id); cur.push(id);
    }
  });
  renumberAll();
  STATE.order.sort((a,b)=> typeRank(STATE.barns[a].type)-typeRank(STATE.barns[b].type));
  if (!STATE.active || !STATE.barns[STATE.active]) STATE.active = STATE.order[0];
  STATE.order.forEach(ensureTrailingEmpty);
  showForm();
}

/* ================================================================== *
 *  INSTANCE MANAGEMENT  (Add / Duplicate / Rename / Remove)
 * ================================================================== */
function autoName(type){
  const label = BTYPE[type].label;
  const sibs = instancesOfType(type);
  if (sibs.length===0) return label;
  if (sibs.length===1 && STATE.barns[sibs[0]].name===label){
    STATE.barns[sibs[0]].name = label+" 1";
    return label+" 2";
  }
  let max = sibs.length;
  sibs.forEach(id=>{ const m=/(\d+)\s*$/.exec(STATE.barns[id].name); if(m) max=Math.max(max, +m[1]); });
  return label+" "+(max+1);
}
function addInstance(type){
  const id=newId();
  const name=autoName(type);
  const sibs=instancesOfType(type);
  STATE.barns[id]=makeBarn(type, name);
  const insertAt = sibs.length ? STATE.order.indexOf(sibs[sibs.length-1])+1 : STATE.order.length;
  STATE.order.splice(insertAt,0,id); STATE.active=id;
  renderTabs(); renderPanel(); autosave();
  toast("Added "+STATE.barns[id].name);
}
function duplicateActive(){
  const cur=STATE.barns[STATE.active];
  const id=newId();
  STATE.barns[id]={ type:cur.type, name:autoName(cur.type), rebound:cur.rebound, general:cur.general,
    foot: cur.foot ? (cur.foot.circle ? {circle:{...cur.foot.circle}} : {quad:cloneQuad(cur.foot.quad)}) : null,
    rows:cur.rows.filter(r=>!rowEmpty(r)).map(r=>newRow(r.location,r.notes,r.x,r.y)) };
  ensureTrailingEmpty(id);
  const i=STATE.order.indexOf(STATE.active);
  STATE.order.splice(i+1,0,id); STATE.active=id;
  renderTabs(); renderPanel(); autosave();
  toast("Duplicated to "+STATE.barns[id].name);
}
function renameActive(){
  const cur=STATE.barns[STATE.active];
  const name=prompt("Rename this barn tab:", cur.name);
  if(name===null) return;
  const v=name.trim(); if(!v){ toast("Name can’t be blank"); return; }
  cur.name=v; renderTabs(); renderPanel(); autosave();
}
function removeActive(){
  if(STATE.order.length<=1){ toast("Keep at least one barn"); return; }
  const cur=STATE.barns[STATE.active];
  if(!confirm("Remove “"+cur.name+"” and all of its notes?")) return;
  const i=STATE.order.indexOf(STATE.active);
  STATE.order.splice(i,1); delete STATE.barns[STATE.active];
  STATE.active=STATE.order[Math.max(0,i-1)];
  renderTabs(); renderPanel(); autosave();
}

/* ================================================================== *
 *  FORM SCREEN
 * ================================================================== */
function showSetup(){
  $("#form").style.display="none";
  $("#setup").style.display="block";
  $("#siteTag").style.display="none";
  prefillSetup();
}
function showForm(){
  $("#setup").style.display="none";
  $("#form").style.display="block";
  $("#siteTag").style.display="inline-flex";
  $("#siteTagName").textContent = STATE.site + (STATE.date? " · "+fmtDate(STATE.date):"");
  renderTabs();
  renderPanel();
  autosave();
}

function renderTabs(){
  const tabs = $("#tabs"); tabs.innerHTML="";
  STATE.order.forEach(id=>{
    const b = STATE.barns[id];
    const t = el("div",{class:"tab"+(id===STATE.active?" active":""),text:b.name});
    t.addEventListener("click",()=>{ STATE.active=id; renderTabs(); renderPanel(); });
    tabs.appendChild(t);
  });
  const wrap = el("div",{class:"addwrap"});
  const btn  = el("button",{class:"addbtn",text:"＋ Add barn"});
  const menu = el("div",{class:"addmenu"},[el("div",{class:"mhdr",text:"Add a barn"})]);
  BARN_TYPES.forEach(tp=>{
    const mi = el("button",{class:"mi",text:tp.label});
    mi.addEventListener("click",(e)=>{ e.stopPropagation(); menu.classList.remove("open"); addInstance(tp.key); });
    menu.appendChild(mi);
  });
  btn.addEventListener("click",(e)=>{ e.stopPropagation();
    const open=menu.classList.contains("open");
    document.querySelectorAll(".addmenu.open").forEach(m=>m.classList.remove("open"));
    if(!open) menu.classList.add("open");
  });
  wrap.appendChild(btn); wrap.appendChild(menu); tabs.appendChild(wrap);
}

function renderPanel(){
  const key = STATE.active;
  const barn = STATE.barns[key];
  const panel = $("#panel"); panel.innerHTML="";

  panel.appendChild(el("h2",{text:titleFor(barn)}));
  panel.appendChild(el("div",{class:"barnsub",text:subLine()}));
  panel.appendChild(el("div",{class:"barnctl"},[
    el("button",{text:"✎ Rename tab", onclick:renameActive}),
    el("button",{text:"⧉ Duplicate", onclick:duplicateActive}),

  ]));

  barn.rows.forEach(r=> rowsWrap.appendChild(buildRowEl(barn, r)));

  rb.appendChild(el("label",{},["Rebound hammer test ", el("span",{class:"sub",text:"(result)"})]));

  gnIn.addEventListener("input",()=>{ barn.general=gnIn.value; autosave(); });
  gn.appendChild(gnIn);

  panel.appendChild(fields);
